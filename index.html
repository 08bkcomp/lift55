<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift55">
<title>Lift55</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #1c1c1e;
  --surface2: #2c2c2e;
  --border: #38383a;
  --text: #ffffff;
  --text2: #8e8e93;
  --accent: #ff6b35;
  --success: #30d158;
  --danger: #ff453a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: calc(56px + var(--safe-bottom));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 430px; margin: 0 auto; }
#content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: var(--nav-h); }

/* Toast */
#toast { position: fixed; top: calc(var(--safe-top) + 16px); left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 11px 18px; border-radius: 12px; font-size: 14px; z-index: 999; white-space: nowrap; transition: opacity 0.25s; }
#toast.hidden { opacity: 0; pointer-events: none; }

/* Nav */
#nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: var(--nav-h); background: rgba(18,18,20,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: flex-start; padding-top: 6px; z-index: 100; }
.nav-btn { flex: 1; background: none; border: none; color: var(--text2); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; cursor: pointer; font-size: 10px; transition: color 0.15s; }
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }

/* Page header */
.ph { padding: calc(var(--safe-top) + 14px) 16px 0; display: flex; align-items: center; gap: 12px; }
.ph-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
.ph-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
.back { width: 34px; height: 34px; border-radius: 10px; background: var(--surface2); border: none; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

/* Cards */
.card { background: var(--surface); border-radius: 16px; margin: 12px 16px; overflow: hidden; }
.card-inner { padding: 16px; }
.card-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; }

/* Section */
.sec-hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 5px; }
.sec-title { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }

/* List */
.list { background: var(--surface); border-radius: 14px; margin: 4px 16px; overflow: hidden; }
.row { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.row:last-child { border-bottom: none; }
a.row, button.row, [onclick].row { cursor: pointer; }
[onclick].row:active, a.row:active { background: var(--surface2); }
.row-main { flex: 1; }
.row-title { font-size: 16px; font-weight: 500; }
.row-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
.chev { color: var(--text2); }
.chev svg { width: 15px; height: 15px; display: block; }

/* Buttons */
.btn { display: block; width: calc(100% - 32px); margin: 8px 16px; padding: 15px; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center; transition: opacity 0.12s, transform 0.1s; letter-spacing: -0.2px; }
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-success { background: var(--success); color: #000; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 9px 16px; font-size: 14px; border-radius: 10px; }

/* Home: next workout preview */
.ex-preview-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.ex-preview-row:last-child { border-bottom: none; }
.ex-preview-name { flex: 1; font-size: 16px; font-weight: 500; }
.ex-preview-sets { font-size: 13px; color: var(--text2); }
.ex-preview-weight { font-size: 15px; font-weight: 700; color: var(--accent); min-width: 72px; text-align: right; }

/* Active workout */
.ex-block { background: var(--surface); border-radius: 16px; margin: 8px 16px; overflow: hidden; }
.ex-block-hdr { padding: 14px 16px 10px; }
.ex-block-name { font-size: 18px; font-weight: 700; }
.ex-block-target { font-size: 13px; color: var(--text2); margin-top: 2px; }
.weight-ctrl { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); }
.weight-ctrl-label { font-size: 13px; color: var(--text2); flex-shrink: 0; }
.weight-ctrl-row { display: flex; align-items: center; gap: 8px; flex: 1; }
.wbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--surface2); border: none; color: var(--text); font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; line-height: 1; }
.winput { flex: 1; background: var(--surface2); border: none; color: var(--text); font-size: 20px; font-weight: 700; text-align: center; padding: 7px 4px; border-radius: 10px; outline: none; min-width: 0; }
.wunit { font-size: 14px; color: var(--text2); flex-shrink: 0; }
.sets-row { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
.set-btn { flex: 1; height: 56px; border-radius: 12px; border: 2px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.set-btn.done { background: var(--success); border-color: var(--success); color: #000; }

/* History */
.hist-item { padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.hist-item:last-child { border-bottom: none; }
.hist-item:active { background: var(--surface2); }
.hist-date { font-size: 12px; color: var(--text2); margin-bottom: 3px; }
.hist-name { font-size: 17px; font-weight: 600; }
.hist-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }

/* Forms */
.fg { margin: 8px 16px; }
.fg + .fg { margin-top: 4px; }
.fl { font-size: 13px; color: var(--text2); margin-bottom: 6px; display: block; }
.fi { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 16px; padding: 12px 14px; border-radius: 12px; outline: none; -webkit-appearance: none; appearance: none; }
.fi:focus { border-color: var(--accent); }
.form-row { display: flex; gap: 0; }
.form-row .fg { flex: 1; }
.form-row .fg:first-child { margin-right: 4px; }
.form-row .fg:last-child { margin-left: 4px; }

/* Toggle */
.toggle { display: flex; background: var(--surface2); border-radius: 10px; padding: 2px; }
.topt { flex: 1; padding: 8px; text-align: center; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; background: none; color: var(--text2); transition: all 0.18s; }
.topt.on { background: var(--surface); color: var(--text); }

/* Settings rows */
.srow { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; background: var(--surface); }
.srow:last-child { border-bottom: none; }
.srow:active { background: var(--surface2); }
.srow-label { flex: 1; font-size: 16px; }
.srow-val { font-size: 16px; color: var(--text2); }
.srow-chev svg { width: 14px; height: 14px; display: block; color: var(--text2); margin-left: 8px; }

/* Schedule */
.sched-num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; display: flex; align-items: flex-end; }
.modal { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 20px 0 calc(16px + var(--safe-bottom)); max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 700; padding: 0 16px 14px; }

/* Detail set badges */
.set-badge { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }

/* Empty */
.empty { text-align: center; padding: 56px 32px; color: var(--text2); }
.empty-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.empty-sub { font-size: 14px; line-height: 1.5; }

/* Spacer */
.gap { height: 16px; }
.gap-sm { height: 8px; }

/* Sync */
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; flex-shrink: 0; }
.sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--danger); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
</style>
</head>
<body>
<div id="app">
  <div id="toast" class="hidden"></div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-btn" id="nav-home" onclick="App.go('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </button>
    <button class="nav-btn" id="nav-history" onclick="App.go('history')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21L13.5 12V8H12z"/></svg>
      History
    </button>
    <button class="nav-btn" id="nav-settings" onclick="App.go('settings')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Settings
    </button>
  </nav>
</div>
<script>
// ── Google Client ID ─────────────────────────────────────────────────────────
// Create one at console.cloud.google.com → APIs & Services → Credentials
// Add your GitHub Pages URL as an Authorized JavaScript Origin
const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID_HERE';

// ── IndexedDB ────────────────────────────────────────────────────────────────
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const req = indexedDB.open('lift55', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      ['exercises','workouts','logs','settings'].forEach(s => {
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
      });
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = rej;
  });
  const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
  const all = s => new Promise((r, j) => { const q = tx(s).getAll(); q.onsuccess = () => r(q.result); q.onerror = j; });
  const get = (s, k) => new Promise((r, j) => { const q = tx(s).get(k); q.onsuccess = () => r(q.result); q.onerror = j; });
  const put = (s, o) => new Promise((r, j) => { const q = tx(s, 'readwrite').put(o); q.onsuccess = () => r(q.result); q.onerror = j; });
  const del = (s, k) => new Promise((r, j) => { const q = tx(s, 'readwrite').delete(k); q.onsuccess = () => r(); q.onerror = j; });
  const clear = s => new Promise((r, j) => { const q = tx(s, 'readwrite').clear(); q.onsuccess = () => r(); q.onerror = j; });
  return { open, all, get, put, del, clear };
})();

// ── Google Auth ───────────────────────────────────────────────────────────────
const GAuth = {
  user: null,
  token: null,
  _client: null,
  _resolve: null,

  async init() {
    const saved = localStorage.getItem('lift55_guser');
    if (saved) { try { this.user = JSON.parse(saved); } catch {} }
    if (GOOGLE_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') return;
    try {
      await this._loadGIS();
      this._client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
        callback: resp => {
          const resolve = this._resolve; this._resolve = null;
          if (resp.error || !resp.access_token) { if (resolve) resolve(null); return; }
          this.token = resp.access_token;
          if (resolve) resolve(this.token);
        },
      });
      if (this.user) {
        // Silent refresh for returning user
        await this._requestToken(true);
      }
    } catch (e) { console.warn('GAuth init failed:', e); }
  },

  _loadGIS() {
    return new Promise((res, rej) => {
      if (window.google?.accounts) { res(); return; }
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  },

  _requestToken(silent = false) {
    return new Promise(res => {
      if (!this._client) { res(null); return; }
      this._resolve = res;
      this._client.requestAccessToken({
        prompt: silent ? 'none' : 'select_account',
        hint: silent ? (this.user?.email || '') : '',
      });
      if (silent) setTimeout(() => { if (this._resolve) { this._resolve(null); this._resolve = null; } }, 8000);
    });
  },

  async signIn() {
    if (!this._client) throw new Error('Google not initialized — check Client ID');
    const token = await this._requestToken(false);
    if (!token) throw new Error('Sign in cancelled');
    const resp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!resp.ok) throw new Error('Could not fetch user info');
    this.user = await resp.json();
    localStorage.setItem('lift55_guser', JSON.stringify(this.user));
    return this.user;
  },

  signOut() {
    if (this.token) { try { google.accounts.oauth2.revoke(this.token, () => {}); } catch {} }
    this.token = null; this.user = null;
    localStorage.removeItem('lift55_guser');
  },

  isSignedIn() { return !!this.user; },

  async ensureToken() {
    if (this.token) return this.token;
    return this._requestToken(true);
  },
};

// ── Google Drive Sync ─────────────────────────────────────────────────────────
const GDrive = {
  _fileId: null,
  _lastSync: null,
  _pushTimer: null,
  status: 'idle',

  async push() {
    if (!GAuth.isSignedIn()) return;
    this._setStatus('syncing');
    try {
      const token = await GAuth.ensureToken();
      if (!token) throw new Error('no token');
      const fileId = await this._getOrCreate(token);
      const body = JSON.stringify(await this._export());
      const r = await fetch(
        `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
        { method: 'PATCH', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body }
      );
      if (!r.ok) throw new Error(`upload ${r.status}`);
      this._lastSync = new Date();
      this._setStatus('idle');
    } catch (e) {
      console.error('Drive push:', e);
      this._setStatus('error');
    }
  },

  async pull() {
    if (!GAuth.isSignedIn()) return false;
    this._setStatus('syncing');
    try {
      const token = await GAuth.ensureToken();
      if (!token) { this._setStatus('idle'); return false; }
      const fileId = await this._findFile(token);
      if (!fileId) { this._setStatus('idle'); return false; }
      this._fileId = fileId;
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!r.ok) throw new Error(`download ${r.status}`);
      await this._import(await r.json());
      this._lastSync = new Date();
      this._setStatus('idle');
      return true;
    } catch (e) {
      console.error('Drive pull:', e);
      this._setStatus('error');
      return false;
    }
  },

  schedulePush() {
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => this.push(), 3000);
  },

  _setStatus(s) {
    this.status = s;
    const el = document.getElementById('sync-dot');
    if (!el) return;
    el.className = 'sync-dot' + (s === 'syncing' ? ' syncing' : s === 'error' ? ' error' : '');
    el.title = s === 'syncing' ? 'Syncing…' : s === 'error' ? 'Sync failed' : this._lastSync ? `Synced ${this._lastSync.toLocaleTimeString()}` : 'Synced';
  },

  async _getOrCreate(token) {
    if (this._fileId) return this._fileId;
    const id = await this._findFile(token);
    if (id) { this._fileId = id; return id; }
    const r = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'lift55-data.json', parents: ['appDataFolder'] }),
    });
    const f = await r.json();
    this._fileId = f.id;
    return f.id;
  },

  async _findFile(token) {
    const r = await fetch(
      "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'lift55-data.json'&fields=files(id)",
      { headers: { Authorization: `Bearer ${token}` } }
    );
    const d = await r.json();
    return d.files?.[0]?.id || null;
  },

  async _export() {
    const [exercises, workouts, logs, settings] = await Promise.all([
      DB.all('exercises'), DB.all('workouts'), DB.all('logs'), DB.all('settings'),
    ]);
    return { version: 1, lastSynced: new Date().toISOString(), exercises, workouts, logs, settings };
  },

  async _import(data) {
    if (!data?.version) return;
    for (const store of ['exercises','workouts','logs','settings']) {
      await DB.clear(store);
      for (const item of (data[store] || [])) await DB.put(store, item);
    }
  },
};

// ── App ──────────────────────────────────────────────────────────────────────
const App = {
  page: 'home',
  pd: {}, // page data
  aw: null, // active workout

  async init() {
    await DB.open();
    const saved = localStorage.getItem('lift55_aw');
    if (saved) { try { this.aw = JSON.parse(saved); } catch {} }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    await GAuth.init();
    if (GAuth.isSignedIn()) {
      const pulled = await GDrive.pull();
      if (!pulled) {
        await this.seedDefaults();
        await GDrive.push(); // first push of local data
      }
    } else {
      await this.seedDefaults();
    }
    this.render();
  },

  go(page, data = {}) {
    this.page = page;
    this.pd = data;
    this.render();
    document.getElementById('content').scrollTo(0, 0);
  },

  async render() {
    const map = {
      home: 'renderHome', 'workout-active': 'renderActive',
      history: 'renderHistory', 'history-detail': 'renderHistoryDetail',
      settings: 'renderSettings', exercises: 'renderExercises',
      'exercise-edit': 'renderExerciseEdit', workouts: 'renderWorkouts',
      'workout-edit': 'renderWorkoutEdit', schedule: 'renderSchedule',
    };
    await this[map[this.page] || 'renderHome']();
    ['home','history','settings'].forEach((p, i) => {
      const btn = document.getElementById('nav-' + p);
      if (btn) btn.classList.toggle('active', p === this.page);
    });
  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => el.classList.add('hidden'), 2200);
  },

  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  html: s => s,

  // ── Google auth actions ───────────────────────────────────────────────────
  async signIn() {
    try {
      await GAuth.signIn();
      this.toast('Signed in');
      const pulled = await GDrive.pull();
      if (!pulled) await GDrive.push();
    } catch (e) {
      this.toast(e.message || 'Sign in failed');
    }
    this.renderSettings();
  },

  signOut() {
    GAuth.signOut();
    GDrive._fileId = null;
    this.toast('Signed out');
    this.renderSettings();
  },

  async syncNow() {
    this.toast('Syncing…');
    await GDrive.push();

  // ── Business logic ────────────────────────────────────────────────────────
  async getNextWorkout() {
    const [sched, logs, workouts] = await Promise.all([DB.get('settings','schedule'), DB.all('logs'), DB.all('workouts')]);
    if (!sched || !sched.workoutIds.length) return null;
    const ids = sched.workoutIds;
    const wMap = Object.fromEntries(workouts.map(w => [w.id, w]));
    if (!logs.length) return wMap[ids[0]] || null;
    const last = logs.sort((a, b) => new Date(b.date) - new Date(a.date))[0];
    const lastIdx = ids.lastIndexOf(last.workoutId);
    const nextIdx = lastIdx === -1 ? 0 : (lastIdx + 1) % ids.length;
    return wMap[ids[nextIdx]] || null;
  },

  async getSuggestedWeight(exerciseId) {
    const [logs, exercise] = await Promise.all([DB.all('logs'), DB.get('exercises', exerciseId)]);
    if (!exercise) return 0;
    const sorted = logs.sort((a, b) => new Date(b.date) - new Date(a.date));
    for (const log of sorted) {
      const ex = log.exercises.find(e => e.exerciseId === exerciseId);
      if (!ex) continue;
      const allDone = ex.sets.length >= ex.targetSets && ex.sets.every(s => s.done);
      return allDone ? ex.weight + exercise.increment : ex.weight;
    }
    return exercise.startWeight;
  },

      <div class="fg"><label class="fl">Unit</label>
        <div class="toggle">
          <button class="topt${this._unit==='lbs'?' on':''}" id="u-lbs" onclick="App.pickUnit('lbs')">lbs</button>
          <button class="topt${this._unit==='kg'?' on':''}" id="u-kg" onclick="App.pickUnit('kg')">kg</button>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="App.saveExercise('${exerciseId||''}')">Save</button>
      ${ex ? `<button class="btn btn-danger" onclick="App.deleteExercise('${exerciseId}')">Delete Exercise</button>` : ''}
      <div class="gap"></div>
    `;
  },

  pickUnit(u) {
    this._unit = u;
    document.getElementById('u-lbs').classList.toggle('on', u === 'lbs');
    document.getElementById('u-kg').classList.toggle('on', u === 'kg');
  },

  async saveExercise(exerciseId) {
    const name = document.getElementById('ex-name').value.trim();
    const startWeight = parseFloat(document.getElementById('ex-start').value);
    const increment = parseFloat(document.getElementById('ex-inc').value);
    const unit = this._unit || 'kg';
    if (!name) { this.toast('Enter a name'); return; }
    if (isNaN(startWeight) || isNaN(increment)) { this.toast('Fill in all fields'); return; }
    await DB.put('exercises', { id: exerciseId || this.uid(), name, startWeight, increment, unit });
    GDrive.schedulePush();
    this.toast('Saved');
    this.go('exercises');
  },

  async deleteExercise(id) {
    if (!confirm('Delete this exercise?')) return;
    await DB.del('exercises', id);
    const ws = await DB.all('workouts');
    for (const w of ws) {
      w.exercises = w.exercises.filter(e => e.exerciseId !== id);
      await DB.put('workouts', w);
    }
    GDrive.schedulePush();
    this.toast('Deleted');
    this.go('exercises');
  },

  // ── Workouts ──────────────────────────────────────────────────────────────
  async renderWorkouts() {
    const workouts = await DB.all('workouts');
    document.getElementById('content').innerHTML = `
      <div class="ph">
        <button class="back" onclick="App.go('settings')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="ph-title">Workouts</div>
      </div>
      <div class="gap"></div>
      ${workouts.length ? `
      <div class="list">
        ${workouts.map(w => `
          <div class="row" onclick="App.go('workout-edit',{workoutId:'${w.id}'})">
            <div class="row-main">
              <div class="row-title">${w.name}</div>
              <div class="row-sub">${w.exercises.length} exercise${w.exercises.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="chev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
          </div>`).join('')}
      </div>` : `<div class="empty"><div class="empty-title">No workouts yet</div></div>`}
      <button class="btn btn-secondary" style="margin-top:12px" onclick="App.go('workout-edit',{workoutId:null})">Add Workout</button>
      <div class="gap"></div>
    `;
  },

  async renderWorkoutEdit() {
    const { workoutId } = this.pd;
    const [workout, exercises] = await Promise.all([
      workoutId ? DB.get('workouts', workoutId) : Promise.resolve(null),
      DB.all('exercises'),
    ]);
    // Init editing state only on fresh load (not re-render)
    if (this._weId !== (workoutId || '__new__')) {
      this._weId = workoutId || '__new__';
      this._weName = workout?.name || '';
      this._weExs = workout ? workout.exercises.map(e => ({...e})) : [];
    }
    const exMap = Object.fromEntries(exercises.map(e => [e.id, e]));

    document.getElementById('content').innerHTML = `
      <div class="ph">
        <button class="back" onclick="App.go('workouts')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="ph-title">${workout ? 'Edit Workout' : 'New Workout'}</div>
      </div>
      <div class="gap"></div>
      <div class="fg"><label class="fl">Workout Name</label>
        <input class="fi" id="w-name" type="text" placeholder="e.g. Workout A" value="${this._weName}"
          oninput="App._weName=this.value">
      </div>
      <div class="sec-hdr" style="margin-top:8px"><span class="sec-title">Exercises</span></div>
      ${this._weExs.map((we, i) => {
        const e = exMap[we.exerciseId];
        return `
        <div class="ex-block">
          <div style="display:flex;align-items:center;padding:12px 16px;gap:10px">
            <div style="flex:1;font-size:16px;font-weight:600">${e?.name||we.exerciseId}</div>
            <button onclick="App.removeWE(${i})" style="background:none;border:none;color:var(--danger);font-size:22px;cursor:pointer;padding:2px 6px;line-height:1">&times;</button>
          </div>
          <div style="display:flex;gap:8px;padding:0 16px 14px;border-top:1px solid var(--border)">
            <div style="flex:1">
              <div class="fl">Sets</div>
              <input class="fi" type="number" min="1" value="${we.sets}" onchange="App.updWE(${i},'sets',+this.value)">
            </div>
            <div style="flex:1">
              <div class="fl">Reps</div>
              <input class="fi" type="number" min="1" value="${we.reps}" onchange="App.updWE(${i},'reps',+this.value)">
            </div>
          </div>
        </div>`;
      }).join('')}
      <button class="btn btn-secondary" onclick="App.showExModal()">+ Add Exercise</button>
      <button class="btn btn-primary" style="margin-top:8px" onclick="App.saveWorkout('${workoutId||''}')">Save Workout</button>
      ${workout ? `<button class="btn btn-danger" onclick="App.deleteWorkout('${workoutId}')">Delete Workout</button>` : ''}
      <div class="gap"></div>
    `;
  },

  updWE(i, field, val) { this._weExs[i][field] = val; },
  removeWE(i) {
    this._weName = document.getElementById('w-name')?.value || this._weName;
    this._weExs.splice(i, 1);
    this.renderWorkoutEdit();
  },

  async showExModal() {
    this._weName = document.getElementById('w-name')?.value || this._weName;
    const exercises = await DB.all('exercises');
    const m = document.createElement('div');
    m.className = 'modal-bg'; m.id = 'ex-modal';
    m.innerHTML = `<div class="modal">
      <div class="modal-title">Add Exercise</div>
      <div class="list" style="margin:0 0 0 0;border-radius:0">
        ${exercises.map(e => `
          <div class="row" onclick="App.addWE('${e.id}')">
            <div class="row-main">
              <div class="row-title">${e.name}</div>
              <div class="row-sub">+${e.increment} ${e.unit} per success</div>
            </div>
          </div>`).join('')}
      </div>
      <button class="btn btn-secondary" style="margin-top:12px" onclick="document.getElementById('ex-modal').remove()">Cancel</button>
    </div>`;
    m.addEventListener('click', e => { if (e.target === m) m.remove(); });
    document.body.appendChild(m);
  },

  addWE(exerciseId) {
    document.getElementById('ex-modal')?.remove();
    this._weExs.push({ exerciseId, sets: 3, reps: 5 });
    this.renderWorkoutEdit();
  },

  async saveWorkout(workoutId) {
    const name = (document.getElementById('w-name')?.value || this._weName).trim();
    if (!name) { this.toast('Enter a workout name'); return; }
    await DB.put('workouts', { id: workoutId || this.uid(), name, exercises: this._weExs });
    this._weId = null;
    GDrive.schedulePush();
    this.toast('Saved');
    this.go('workouts');
  },

  async deleteWorkout(id) {
    if (!confirm('Delete this workout?')) return;
    await DB.del('workouts', id);
    const sched = await DB.get('settings', 'schedule');
    if (sched) { sched.workoutIds = sched.workoutIds.filter(x => x !== id); await DB.put('settings', sched); }
    this._weId = null;
    GDrive.schedulePush();
    this.toast('Deleted');
    this.go('workouts');
  },

  // ── Schedule ──────────────────────────────────────────────────────────────
  async renderSchedule() {
    const [sched, workouts] = await Promise.all([DB.get('settings','schedule'), DB.all('workouts')]);
    const ids = sched?.workoutIds || [];
    const wMap = Object.fromEntries(workouts.map(w => [w.id, w]));

    document.getElementById('content').innerHTML = `
      <div class="ph">
        <button class="back" onclick="App.go('settings')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div>
          <div class="ph-title">Schedule</div>
          <div class="ph-sub">Repeating workout rotation</div>
        </div>
      </div>
      <div class="gap"></div>
      <div class="sec-hdr"><span class="sec-title">Current Order</span></div>
      <div class="list">
        ${ids.length ? ids.map((wid, i) => `
          <div class="row">
            <div class="sched-num">${i+1}</div>
            <div class="row-main"><div class="row-title">${wMap[wid]?.name||wid}</div></div>
            <button onclick="App.removeFromSched(${i})" style="background:none;border:none;color:var(--danger);font-size:14px;font-weight:600;cursor:pointer;padding:6px 10px">Remove</button>
          </div>`).join('') : `
          <div style="padding:18px 16px;color:var(--text2);text-align:center;font-size:14px">No workouts in schedule yet</div>`}
      </div>
      <div class="sec-hdr" style="margin-top:16px"><span class="sec-title">Add to Rotation</span></div>
      <div class="list">
        ${workouts.map(w => `
          <div class="row" onclick="App.addToSched('${w.id}')">
            <div class="row-main"><div class="row-title">${w.name}</div></div>
            <div style="color:var(--accent);font-weight:700;font-size:14px">+ Add</div>
          </div>`).join('')}
      </div>
      <div class="gap"></div>
    `;
  },

  async addToSched(workoutId) {
    const sched = await DB.get('settings','schedule') || { id: 'schedule', workoutIds: [] };
    sched.workoutIds.push(workoutId);
    await DB.put('settings', sched);
    GDrive.schedulePush();
    this.renderSchedule();
  },

  async removeFromSched(idx) {
    const sched = await DB.get('settings','schedule');
    if (!sched) return;
    sched.workoutIds.splice(idx, 1);
    await DB.put('settings', sched);
    GDrive.schedulePush();
    this.renderSchedule();
  },
};

App.init();
</script>
</body>
</html>
